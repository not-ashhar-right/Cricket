<!doctype html>
<html lang="en">
  <head>
    <title>Cricket</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="head">
      <h1>Cricket Game</h1>
    </div>
    <div class="hello">
      
      <button
        class="hey"
        onclick="
          let comptchoice = myFunction();
          let result=compare('bat', comptchoice);
          alerting('bat', comptchoice, result);
        "
      >
      <img src="images/bat.png" alt="bat" width="50px" height="100px" />
      </button>
      <button
        class="hey"
        
        onclick="
          comptchoice = myFunction();
          result=compare('ball', comptchoice);
          alerting('ball', comptchoice, result);
        "
      >
      <img src="images/ball.png" alt="ball" width="50px" height="50px" />
      </button>
      <button
        class="hey"
        onclick="
          comptchoice = myFunction();
          result=compare('stump', comptchoice);
          alerting('stump', comptchoice, result);
        "
      >
      <img src="images/stump.png" alt="stump" width="50px" height="100px" />
      </button>
    </div>
    <div id="score">
      <h3 class="idk"></h3> 
      <h3 id="win"></h3>
      <h3 id="lose"></h3>
      <h3 id="draw"></h3>
      </div>
    <div class="say">
      <button class="am " onclick="resetScore()">  
        Reset Score
      </button>
    </div>
    
    <script src="script.js"></script>
  </body>
</html>
